title: Failed Logon Event (Base) - Kerberos/NTLM Authentication Failure
name: failed_logon_base
id: 66100126-418b-466b-b8ac-afd6a42c492a
status: test
description: Base event match for EventID 4625 (failed logon), correlated below into a password-spray detection.
author: Detection Lab
date: 2026-09-12
logsource:
    product: windows
    service: security
    definition: 'Requires Advanced Audit Policy > Logon/Logoff > Audit Logon (Failure) enabled on the DC.'
detection:
    selection:
        EventID: 4625
    condition: selection
level: informational
---
title: Password Spraying - Multiple Failed Logons Across Distinct Accounts
id: 63d1a0f1-2b2d-4a2a-9b8d-1c3f7e2e9a11
status: test
description: |
    Detects a burst of failed logons (EventID 4625) against many distinct
    target accounts from the same source in a short window - the signature
    of a password spray (one or two passwords tried against a large user
    list) rather than a brute force against one account.
references:
    - https://attack.mitre.org/techniques/T1110/003/
author: Detection Lab
date: 2026-09-12
tags:
    - attack.credential-access
    - attack.t1110.003
correlation:
    type: value_count
    rules:
        - failed_logon_base
    group-by:
        - IpAddress
    timespan: 10m
    condition:
        field: TargetUserName
        gte: 6
falsepositives:
    - A misconfigured service or mapped drive retrying a single stale credential
      against many accounts (e.g. a scheduled task running under a rotated
      service account before all dependent jobs are updated).
    - Helpdesk-driven bulk password resets where users are still typing their
      old password during a grace period.
level: medium
