title: Potential AS-REP Roasting via Disabled Kerberos Pre-Authentication
id: c4d35c7e-eee4-41d2-b9ea-86d20e17b61a
status: test
description: |
    Detects Kerberos AS-REQ/AS-REP exchanges (EventID 4768) where the
    Pre-Authentication Type field is 0, indicating the account has
    "Do not require Kerberos preauthentication" (DONT_REQ_PREAUTH) set.
    This lets an attacker request an AS-REP for any such account without
    valid credentials and crack it offline (AS-REP Roasting).
references:
    - https://attack.mitre.org/techniques/T1558/004/
author: Okunnuwa Joshua Godwin
date: 2026-09-12
modified: 2026-11-26
tags:
    - attack.credential-access
    - attack.t1558.004
logsource:
    product: windows
    service: security
    definition: 'Requires Advanced Audit Policy > Account Logon > Audit Kerberos Authentication Service (Success) enabled on the DC.'
detection:
    selection:
        EventID: 4768
        PreAuthType: 0
        # The attack tool asks the DC for RC4 only, so the part of the reply an
        # attacker cracks offline is RC4-encrypted (0x17). A normal logon by the
        # same pre-auth-disabled account negotiates AES (0x12). Tested against
        # recorded lab events on 25 Nov 2026: see tuning/false_positive_scenarios.md,
        # Exercise 3.
        SessionKeyEncryptionType: '0x17'
    condition: selection
falsepositives:
    - Legitimate accounts intentionally configured without pre-auth for interoperability
      with older or third-party Kerberos clients (rare, should be inventoried and
      allow-listed by SamAccountName).
    - Any tool that authenticates as a pre-auth-disabled account while requesting RC4
      only. In the lab this includes Impacket logging in as that account for other
      attacks (e.g. GetUserSPNs.py), which is attacker activity in its own right.
    - Normal logons by a pre-auth-disabled account are filtered out by the
      SessionKeyEncryptionType condition. The real fix is still to require
      pre-authentication on every account.
level: high
