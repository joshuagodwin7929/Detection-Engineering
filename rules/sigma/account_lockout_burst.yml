title: Account Lockout Event (Base)
name: account_lockout_base
id: d6cc2d83-7c75-4b5e-b538-8f86ab7a5ba4
status: test
description: Base event match for EventID 4740 (account lockout), correlated below to catch lockout bursts.
author: Detection Lab
date: 2026-09-12
logsource:
    product: windows
    service: security
    definition: 'Requires Advanced Audit Policy > Logon/Logoff > Audit Account Lockout (Success), and SCENoApplyLegacyAuditPolicy enabled so Advanced Audit Policy is not silently overridden by the legacy policy.'
detection:
    selection:
        EventID: 4740
    condition: selection
